[package]
name = "yserver"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
# No target auto-discovery: `yserver` is declared explicitly below, and a
# stray src/bin/*.rs must never become a shipped binary by accident. This
# is how the removed `ynest` binary would otherwise come back — deleting
# its [[bin]] block is not enough, cargo re-adds src/bin/ynest.rs.
autobins = false

[lib]
name = "yserver"
path = "src/lib.rs"

[[bin]]
name = "yserver"
path = "src/bin/yserver.rs"

[dependencies]
ash.workspace = true
crossbeam-channel.workspace = true
drm.workspace = true
env_logger.workspace = true
fontconfig = "0.11"
freetype-rs.workspace = true
gbm.workspace = true
gpu-allocator.workspace = true
input.workspace = true
libc.workspace = true
log.workspace = true
nix.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
xkbcommon.workspace = true
yserver-core.workspace = true
yserver-protocol.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
udev.workspace = true

[lints]
workspace = true
