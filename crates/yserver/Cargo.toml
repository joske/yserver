[package]
name = "yserver"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
# No target auto-discovery: `yserver` is declared explicitly below, and a
# stray src/bin/*.rs must never become a shipped binary by accident. This
# is how the removed `ynest` binary would otherwise come back — deleting
# its [[bin]] block is not enough, cargo re-adds src/bin/ynest.rs.
autobins = false

[lib]
name = "yserver"
path = "src/lib.rs"

[[bin]]
name = "yserver"
path = "src/bin/yserver.rs"

[dependencies]
ash.workspace = true
crossbeam-channel.workspace = true
env_logger.workspace = true
flate2 = "1.1"
freetype-rs.workspace = true
libc.workspace = true
log.workspace = true
regex = "1.13.1"
roxmltree.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
# IPV6_V6ONLY before bind, which std cannot set.
socket2 = "0.6"
thiserror.workspace = true
xkbcommon.workspace = true
yserver-core.workspace = true
yserver-protocol.workspace = true
yserver-render.workspace = true

[dev-dependencies]
yserver-render = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Windows finds its fonts by scanning the font directories (`kms/font_scan.rs`).
[target.'cfg(not(windows))'.dependencies]
fontconfig = "0.11"

# The DRM/KMS platform; build.rs emits `cfg(kms)` for the same targets.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
drm.workspace = true
gbm.workspace = true
input.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
udev.workspace = true
# The rootless Wayland host (`src/wayland/`), behind feature `wayland`:
# wayland-client on its own Rust implementation of the wire (not the
# `system` libwayland one), and the protocols beyond the core it speaks.
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"], optional = true }

# The AppKit window shell (`src/macos/`).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2 = "=0.6.5"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"
objc2-quartz-core = "=0.3.2"
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

# The icon resource in yserver.exe (`build.rs`, `yserver.rc`); rc.exe
# comes with the MSVC Build Tools.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

# The Win32 window shell (`src/windows/`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Both features are OFF by default, for two different reasons: enabling a TCP
# listener lowers the server's security posture, so it must be an affirmative
# decision by whoever builds the binary; and XDMCP is niche, 5,291 lines that
# most deployments never negotiate a session over. `--features xdmcp` implies
# `tcp-transport` because XDMCP's whole purpose is the TCP connect-back.
default = []
tcp-transport = []
xdmcp = ["tcp-transport", "yserver-core/xdmcp"]
# The rootless Wayland host (`src/wayland/`): each top-level X window an
# `xdg_toplevel` of the compositor `WAYLAND_DISPLAY` names, under
# `YSERVER_BACKEND=wayland`. Off by default, so a build that does not ask
# for it pulls in no Wayland crates. Linux only. xkbcommon's own `wayland`
# feature reads the compositor's keymap from its descriptor.
wayland = ["dep:wayland-client", "dep:wayland-protocols", "xkbcommon/wayland"]

[lints]
workspace = true
