# Use yserver as lightdm's X server for a graphical login.
#
# Install with:
#   sudo install -Dm0644 /usr/share/yserver/lightdm-99-yserver.conf \
#       /etc/lightdm/lightdm.conf.d/99-yserver.conf
#   sudo systemctl restart lightdm   # from a free TTY
#
# lightdm exec's xserver-command with X-style argv (":N", a -auth cookie file,
# etc.) and waits for the SIGUSR1 readiness signal; yserver handles both.

[Seat:*]
xserver-command=/usr/bin/yserver
