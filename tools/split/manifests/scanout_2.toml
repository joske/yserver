# Phase 2 (2.7) for kms/vk/scanout.rs: production items move into
# descendant modules of kms::vk::scanout (log targets keep the old prefix),
# grouped by responsibility: bo_state (BO and copied-ownership state
# machines), bo (ScanoutBo allocate/export/teardown), bo_pool
# (ScanoutBoPool, OutputScanout), copied (copied PRIME render source and
# pool), dmabuf_metadata (PRIME/modifier route classification), probe
# (disposable probes, probe fences, copied probe validation), errors,
# alloc_plan (allocation plans, pitch), modifiers (modifier candidates,
# overrides, format-feature queries) and image_alloc (Vulkan/GBM scanout
# image, framebuffer, transfer resources). scanout.rs keeps the imports and
# every type (private fields stay readable from all children and from
# scanout/tests) and the test module declaration.
# Needs a prep commit first: the 27 relative `super::` paths outside the
# root imports qualified to `crate::kms::vk::…`.
