# Phase 2 (2.6) for process_request.rs: production items move into
# descendant modules of core_loop::process_request (log targets keep the
# old prefix), one per request family; process_request.rs keeps the
# imports, opcode consts, RequestOutcome, the dispatch match and the
# helpers shared by several families. Each child starts `use super::*;`;
# the root glob-imports every child at the widest visibility one of its
# items has (`pub use` / `pub(crate) use` / `use`; a glob caps each name
# at the item's own visibility), so every existing `process_request::name`
# path, in this crate and in `yserver`, keeps resolving unchanged.
# Needs the prep commit first: `super::run::` / `super::process_disconnect::`
# (15 sites) qualified to `crate::core_loop::…` so they mean the same
# module from a child. Visibility: 140 dispatch targets + ~37 sibling
# helpers + ~43 helpers that only tests reach (all pub(super));
# handle_xi2_request is pub(in crate::core_loop::process_request).
