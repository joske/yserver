[exceptions]
"fn handle_render_request" = "verify_pictures! is defined and used only inside this fn; its transcriber names fn locals (state, client_id, sequence, minor, header), crate::nested (absolute), u16, first_missing_picture (moves with it) and emit_x11_error_with_minor (root, reached through use super::*): same items at the new call site"
"fn handle_xinerama_request" = "require_len! is defined and used only inside this fn; its transcriber names fn locals (body, state, client_id, sequence, minor), the fn-local const XINERAMA_MAJOR_OPCODE and fn-local import error, and emit_x11_error_with_minor (root, reached through use super::*): same items at the new call site"

