# Phase 2 (2.10) for kms/render/engine.rs: production items move into
# descendant modules of kms::render::engine (log targets keep the old
# prefix), grouped by lifecycle and responsibility: lifecycle (create,
# retire, teardown), frame (frame builder open/close/submit, coalescing
# stats, commit/rollback), staging (upload arena, staging buffers/pool),
# scratch (scratch images, clip snapshots), the op-recording files
# (fill_copy, put_get, text, glyphs, composite, batch, gradients, traps),
# emit (close-time replay of recorded ops into the command buffer), pixels
# (wire <-> storage pixel conversion) and for_tests. engine.rs keeps the
# imports, every type (private fields stay readable from all children), the
# Debug/Send/Sync/From impls and the test module declaration. Needs a prep
# commit first: the relative `super::` paths (frame_builder, submit_group,
# upload_arena, descriptor_pool_ring, platform, …) qualified to
# `crate::kms::render::…` so they mean the same module from a child.
