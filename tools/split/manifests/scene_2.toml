# Phase 2 (2.9) for kms/render/scene.rs: production items move into
# descendant modules of kms::render::scene (log targets keep the old
# prefix), grouped by responsibility: lifecycle (create, output rebuild,
# teardown), damage (scene-structure damage marking, wake, root overlay,
# projection/fan-out onto outputs), cursor (cursor plane mode, transitions,
# retire, software cursor save), tick (scheduling and the per-output tick),
# flip (page-flip and render-completion retirement), damage_audit, repaint
# (partial-compose planning), build (scene list assembly) and walk
# (per-window visibility decisions), compose (ComposeRenderTarget for scanout
# targets, record and submit), transform (transform intermediates, scale
# pass), root_readback and for_tests. scene.rs keeps the imports, every type
# and the ComposeRenderTarget trait (private fields stay readable from all
# children), the SceneError From impls and the test module declaration.
# Needs a prep commit first: the relative `super::` paths (store, backend,
# root_overlay) qualified to `crate::kms::render::…` so they mean the same
# module from a child.
