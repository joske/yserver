# Phase 2 (2.8) for kms/render/platform.rs: production items move into
# descendant modules of kms::render::platform (log targets keep the old
# prefix). GPU-only (Boundary A, future GpuCore): fence (FenceTicket,
# FencePool, PresentCompletionSignal), storage_alloc (drawable image
# allocation and views), submit (submit group, flush, paint submits). KMS:
# init (open, from_platform_init, rollback guard, Drop), devices (device,
# route and output-geometry accessors), qualify (scanout-route
# qualification worker), cursor (cursor plane), flip_events (DRM events,
# page flips, render completions, present clocks), scanout_bos (scanout BO
# lifecycle), connectors (probe, enable/disable, snapshot, layout) and
# power (idle wait, disable_output, DPMS). platform.rs keeps the imports,
# every type and const (private fields stay readable from all children and
# from platform/tests) and the test module declaration.
# Needs a prep commit first: the two relative `super::submit_group` paths
# qualified to `crate::kms::render::submit_group`.
