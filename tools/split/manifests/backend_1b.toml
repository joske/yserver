# Phase 1b for kms/render/backend/tests.rs: the flat test module becomes
# tests/mod.rs (imports, helpers shared by several topics, the pub(super)
# fixtures other test modules use, and the inline get_image_planes module)
# plus one topic module per subsystem; each topic starts `use super::*;`.
# Tests by subsystem (name + file block), helpers with the only topic using
# them, else in mod.rs. Every include path gains one `../` (tests.rs →
# tests/<topic>.rs).
