# Phase 2 (2.11a) for kms/render/backend.rs (executed 2026-10-09): production
# items move into descendant modules of kms::render::backend (log targets
# keep the old prefix), split along the portable-render vs KMS seam:
# backend/portable/<topic>.rs, backend/kms/<topic>.rs, backend/for_tests.rs
# and backend/trait_impl.rs (the whole `impl Backend for KmsBackend`, kept as
# one block: a trait impl cannot be spread over files without delegation,
# which is step 2.11b). backend.rs keeps the imports, every type (private
# fields stay readable from all children), the small helper-type impls and
# the test module declarations. Inherent `impl KmsBackend` members are
# spread per topic; cursor goes to kms/cursor.rs (mostly cursor-plane;
# jos decision 4). Needs a prep commit first: 32 relative `super::` paths
# (engine/store/target/platform/probe_executor/super::super::vk) qualified
# to `crate::kms::…` so they mean the same module from a child.
